<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>日次出納帳 2026年7月</title>
<style>
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
       color:#1a1a1a;background:#fff;margin:0;padding:28px;line-height:1.5;}
  .wrap{max-width:680px;margin:0 auto;}
  .month{font-size:18px;font-weight:700;margin:0 0 16px;}
  h3{font-size:16px;font-weight:700;margin:0 0 6px;padding:6px 10px;background:#f4f6f8;border-left:4px solid #6b8bbd;}
  section{margin-bottom:26px;}
  table.ledger{width:100%;border-collapse:collapse;font-size:14px;}
  table.ledger th,table.ledger td{border:1px solid #cfd8e3;padding:7px 8px;}
  table.ledger th{background:#eef2f7;color:#445;font-weight:600;font-size:13px;}
  table.ledger td.date{white-space:nowrap;width:50px;color:#333;}
  table.ledger td.sum,table.ledger th.sum{text-align:right;width:90px;}
  table.ledger td.bal{text-align:right;width:98px;font-weight:600;background:#fafbfc;}
  table.ledger tr.carry td{background:#f7faf7;font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <p class="month">日次出納帳　2026年7月</p>

  <section>
    <h3>① 手持ち現金</h3>
    <table class="ledger">
      <thead><tr><th>月日</th><th>摘要</th><th class="sum">収入金額</th><th class="sum">支払金額</th><th class="sum">差引残高</th></tr></thead>
      <tbody>
        <tr class="carry"><td class="date">7/1</td><td>繰越</td><td class="sum"></td><td class="sum"></td><td class="bal">37</td></tr>
        <tr><td class="date">7/1</td><td>収入</td><td class="sum">10,000</td><td class="sum"></td><td class="bal">10,037</td></tr>
      </tbody>
    </table>
  </section>

  <section>
    <h3>② PASMO</h3>
    <table class="ledger">
      <thead><tr><th>月日</th><th>摘要</th><th class="sum">収入金額</th><th class="sum">支払金額</th><th class="sum">差引残高</th></tr></thead>
      <tbody>
        <tr class="carry"><td class="date">7/1</td><td>PASMO残高（繰越）</td><td class="sum"></td><td class="sum"></td><td class="bal">353</td></tr>
      </tbody>
    </table>
  </section>

  <section>
    <h3>③ 個人口座</h3>
    <table class="ledger">
      <thead><tr><th>月日</th><th>摘要</th><th class="sum">収入金額</th><th class="sum">支払金額</th><th class="sum">差引残高</th></tr></thead>
      <tbody>
        <tr class="carry"><td class="date">7/1</td><td>個人口座残高（繰越）</td><td class="sum"></td><td class="sum"></td><td class="bal">949</td></tr>
      </tbody>
    </table>
  </section>

</div>
</body>
</html>
