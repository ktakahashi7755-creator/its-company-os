<!doctype html>
<!--
  出力イメージのサンプル（提供スクショ IMG_9099 の再現）。
  家族向け 提出_家族_YYYY-MM.html はこのデザインに合わせて生成する。
  ※ここの数値は「見た目の見本」であり、当月の確定データではない。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>交通費一覧（サンプル）</title>
<style>
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
       color:#222;background:#fff;margin:0;padding:32px;line-height:1.6;}
  .wrap{max-width:760px;margin:0 auto;}
  h2{font-size:20px;font-weight:700;margin:8px 0 16px;}
  table{width:100%;border-collapse:collapse;margin-bottom:8px;}
  th{font-weight:600;color:#555;text-align:left;font-size:14px;
     border-bottom:2px solid #e3e3e3;padding:10px 8px;}
  th.num,td.num{text-align:left;}
  td{padding:14px 8px;border-bottom:1px solid #eee;font-size:15px;}
  td.store{font-weight:600;}
  .total{margin-top:28px;}
  .total h2{margin-bottom:8px;}
  .total .row{font-size:16px;margin:4px 0;}
  .total .row b{font-weight:700;}
  .balance{margin-top:28px;}
  .balance .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;max-width:520px;}
  .balance .item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 4px;font-size:15px;}
  .note{color:#999;font-size:12px;margin-top:24px;}
</style>
</head>
<body>
<div class="wrap">

  <h2>【交通費一覧】</h2>
  <table>
    <thead>
      <tr><th>店舗</th><th class="num">稼働日数</th><th class="num">往復分交通費</th><th class="num">交通費合計</th></tr>
    </thead>
    <tbody>
      <tr><td class="store">蒲田</td>    <td class="num">16日</td><td class="num">1,741円</td><td class="num">27,856円</td></tr>
      <tr><td class="store">分倍河原</td><td class="num">5日</td> <td class="num">844円</td>  <td class="num">4,220円</td></tr>
      <tr><td class="store">武蔵小杉</td><td class="num">2日</td> <td class="num">1,702円</td><td class="num">3,404円</td></tr>
      <tr><td class="store">調布</td>    <td class="num">2日</td> <td class="num">1,210円</td><td class="num">2,420円</td></tr>
      <tr><td class="store">座間</td>    <td class="num">1日</td> <td class="num">1,866円</td><td class="num">1,866円</td></tr>
      <tr><td class="store">港南台</td>  <td class="num">1日</td> <td class="num">2,714円</td><td class="num">2,714円</td></tr>
    </tbody>
  </table>

  <div class="total">
    <h2>【合計】</h2>
    <div class="row">稼働日数：<b>27日</b></div>
    <div class="row">交通費合計：<b>42,480円</b></div>
  </div>

  <div class="balance">
    <h2>【残高】（サンプル）</h2>
    <div class="grid">
      <div class="item"><span>手持ち残高</span><span>—円</span></div>
      <div class="item"><span>PASMO口座残高</span><span>—円</span></div>
      <div class="item"><span>個人口座残高</span><span>—円</span></div>
      <div class="item"><span>法人口座残高</span><span>—円</span></div>
    </div>
  </div>

  <p class="note">※ これは出力デザインのサンプル（IMG_9099 再現）です。当月の確定データではありません。</p>

</div>
</body>
</html>
