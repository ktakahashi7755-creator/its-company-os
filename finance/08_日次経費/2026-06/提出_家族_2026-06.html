<!doctype html>
<!-- 自動生成（家族向け・スクショ用）。元データは ../明細.md ＋ ../残高.md。デザイン基準は ../_sample/交通費一覧_サンプル.html -->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>交通費一覧 2026年6月</title>
<style>
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
       color:#222;background:#fff;margin:0;padding:32px;line-height:1.6;}
  .wrap{max-width:760px;margin:0 auto;}
  h2{font-size:20px;font-weight:700;margin:8px 0 16px;}
  table{width:100%;border-collapse:collapse;margin-bottom:8px;}
  th{font-weight:600;color:#555;text-align:left;font-size:14px;border-bottom:2px solid #e3e3e3;padding:10px 8px;}
  td{padding:14px 8px;border-bottom:1px solid #eee;font-size:15px;}
  td.store{font-weight:600;}
  .total{margin-top:28px;}.total .row{font-size:16px;margin:4px 0;}.total .row b{font-weight:700;}
  .balance{margin-top:28px;}
  .balance .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;max-width:520px;}
  .balance .item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 4px;font-size:15px;}
  .empty{color:#999;padding:24px 8px;}
</style>
</head>
<body>
<div class="wrap">

  <h2>【交通費一覧】<span style="font-size:14px;color:#999;font-weight:400;">2026年6月</span></h2>
  <table>
    <thead>
      <tr><th>店舗</th><th>稼働日数</th><th>往復分交通費</th><th>交通費合計</th></tr>
    </thead>
    <tbody>
      <!-- 記録が入ると店舗行が生成される -->
      <tr><td class="empty" colspan="4">記録待ち（今日の内容を送ると反映されます）</td></tr>
    </tbody>
  </table>

  <div class="total">
    <h2>【合計】</h2>
    <div class="row">稼働日数：<b>—日</b></div>
    <div class="row">交通費合計：<b>—円</b></div>
  </div>

  <div class="balance">
    <h2>【残高】</h2>
    <div class="grid">
      <div class="item"><span>手持ち残高</span><span>—円</span></div>
      <div class="item"><span>PASMO口座残高</span><span>—円</span></div>
      <div class="item"><span>個人口座残高</span><span>—円</span></div>
      <div class="item"><span>法人口座残高</span><span>—円</span></div>
    </div>
  </div>

</div>
</body>
</html>
