name: SES自動マッチング

on:
  schedule:
    # GitHub ActionsのcronはUTC。8:30 JST = 23:30 UTC（前日）。
    - cron: "30 23 * * *"
  workflow_dispatch: {}   # 手動実行（テスト用）

jobs:
  ses-matching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r automation/requirements.txt
      - name: Run SES matching (IMAP -> score -> digest/Notion)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}          # 任意（既定 claude-sonnet-4-6）
          IMAP_HOST: ${{ secrets.IMAP_HOST }}                   # 受信サーバ名（スマホ設定に記載）
          IMAP_PORT: ${{ vars.IMAP_PORT }}                      # 任意（既定 993）
          IMAP_USER: ${{ secrets.IMAP_USER }}                   # contact@reorga.co.jp（受信専用）
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}           # ★Secretsで渡す（コードに書かない）
          IMAP_FOLDER: ${{ vars.IMAP_FOLDER }}                  # 任意（既定 INBOX / SES/REOorGA）
          FRESH_DAYS: ${{ vars.FRESH_DAYS }}                    # 任意（既定 5）
          SALES_FROM: ${{ vars.SALES_FROM }}                   # 任意（既定 sales@its-tokyo.com）
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}             # 任意（レビューDBへ投稿）
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: python automation/ses-matching/run_ses_matching.py --source imap
      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ses-digest
          path: automation/ses-matching/digests/
          if-no-files-found: ignore
