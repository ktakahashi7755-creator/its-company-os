name: SES自動マッチング

on:
  # ✅ 再開（2026-07-22）：案件を新スコープ（遊技機 情シスインフラPL＝サーバ×NW両刀）へ改定し再稼働。
  #   停止経緯：KNさんが旧スコープ(NW/Sec)でオファー獲得→スコープ見直しで一時停止（2026-07-21）→新スコープで再開。
  #   停止するには下の schedule ブロックを再コメントアウトする（cron はそのまま）。案件本体は automation/ses-matching/ 直下。
  schedule:
    # GitHub ActionsのcronはUTC。7:00 JST = 22:00 UTC（前日）。
    # ★狙いを7:00 JSTに前倒し。GitHubのschedule起動は数十分〜1時間超遅延することがあり、
    #   その遅延を見込んでも「8:30までに手元（Notion / sales@ Drafts）に揃う」ためのバッファ。
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # 手動実行は残す（配線確認用）
  # ★一時トリガー（代表指示2026-07-22「前と同じように走らせて」）：dispatch APIが権限で使えないため
  #   pushで1回実行させる。同一リポジトリPRのためSecrets(IMAP/OpenAI/Notion)が渡る。実行後に本ブロックは削除する。
  pull_request:
    branches: ["claude/focused-bell-kt8d7o"]

jobs:
  ses-matching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r automation/requirements.txt
      - name: Eval gate (deterministic・APIキー不要・退行検知)
        run: python automation/ses-matching/eval/run_eval.py --stage all
      - name: Run SES matching (IMAP -> score -> digest/Notion)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}         # あればOpenAIを自動採用（安価）
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o' }}   # 既定 gpt-4o（代表決定2026-07-22：本命1.00・年齢flag原則回復）。vars.OPENAI_MODEL で上書き可
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}                # 任意（openai / anthropic 明示指定）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # OpenAIを使わない場合のみ
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}          # 任意（既定 claude-sonnet-4-6）
          IMAP_HOST: ${{ secrets.IMAP_HOST }}                   # 受信サーバ名（スマホ設定に記載）
          IMAP_PORT: ${{ vars.IMAP_PORT }}                      # 任意（既定 993）
          IMAP_USER: ${{ secrets.IMAP_USER }}                   # contact@reorga.co.jp（受信専用）
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}           # ★Secretsで渡す（コードに書かない）
          IMAP_FOLDER: ${{ vars.IMAP_FOLDER }}                  # 任意（既定 INBOX / SES/REOorGA）
          FRESH_DAYS: ${{ vars.FRESH_DAYS }}                    # 任意（既定 5）
          MAX_FETCH: ${{ vars.MAX_FETCH }}                      # 任意（既定 2500・最新何件まで取得）
          MSG_BYTES: ${{ vars.MSG_BYTES }}                      # 任意（既定 40000・1通の取得バイト数）
          STAGE2_MAX: ${{ vars.STAGE2_MAX }}                    # 任意（既定 60・AI採点に回す上限）
          PICKUP_MIN: ${{ vars.PICKUP_MIN || '90' }}           # 本命(自動下書き/Notion)しきい値。代表指示2026-07-22で90点以上に絞る（既定85→90）。vars.PICKUP_MIN で上書き可
          SALES_FROM: ${{ vars.SALES_FROM }}                   # 任意（既定 sales@its-tokyo.com）
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}             # Notion連携トークン
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}         # ★親ページID（配下に日次候補ページを自動作成）
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}             # 任意（レビューDBへ行追加）
          SALES_IMAP_HOST: ${{ secrets.SALES_IMAP_HOST }}       # sales@its-tokyo.com の受信サーバ名（下書き保存用）
          SALES_IMAP_USER: ${{ secrets.SALES_IMAP_USER }}       # 既定 sales@its-tokyo.com
          SALES_IMAP_PASSWORD: ${{ secrets.SALES_IMAP_PASSWORD }} # ★Secret（sales@のパスワード）
          SALES_IMAP_PORT: ${{ vars.SALES_IMAP_PORT }}          # 任意（既定 993）
          SALES_DRAFTS_FOLDER: ${{ vars.SALES_DRAFTS_FOLDER }}  # 任意（既定 Drafts／例 INBOX.Drafts）
        run: python automation/ses-matching/run_ses_matching.py --source imap
      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ses-digest
          path: automation/ses-matching/digests/
          if-no-files-found: ignore
