name: SES自動マッチング

on:
  schedule:
    # GitHub ActionsのcronはUTC。8:30 JST = 23:30 UTC（前日）。
    - cron: "30 23 * * *"
  workflow_dispatch: {}   # 手動実行（テスト用）

jobs:
  ses-matching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r automation/requirements.txt
      - name: Eval gate (deterministic・APIキー不要・退行検知)
        run: python automation/ses-matching/eval/run_eval.py --stage prefilter && python automation/ses-matching/eval/run_eval.py --stage draft
      - name: Run SES matching (IMAP -> score -> digest/Notion)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}         # あればOpenAIを自動採用（安価）
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}                # 任意（既定 gpt-4o-mini）
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}                # 任意（openai / anthropic 明示指定）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # OpenAIを使わない場合のみ
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}          # 任意（既定 claude-sonnet-4-6）
          IMAP_HOST: ${{ secrets.IMAP_HOST }}                   # 受信サーバ名（スマホ設定に記載）
          IMAP_PORT: ${{ vars.IMAP_PORT }}                      # 任意（既定 993）
          IMAP_USER: ${{ secrets.IMAP_USER }}                   # contact@reorga.co.jp（受信専用）
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}           # ★Secretsで渡す（コードに書かない）
          IMAP_FOLDER: ${{ vars.IMAP_FOLDER }}                  # 任意（既定 INBOX / SES/REOorGA）
          FRESH_DAYS: ${{ vars.FRESH_DAYS }}                    # 任意（既定 5）
          MAX_FETCH: ${{ vars.MAX_FETCH }}                      # 任意（既定 2500・最新何件まで取得）
          MSG_BYTES: ${{ vars.MSG_BYTES }}                      # 任意（既定 40000・1通の取得バイト数）
          STAGE2_MAX: ${{ vars.STAGE2_MAX }}                    # 任意（既定 60・AI採点に回す上限）
          SALES_FROM: ${{ vars.SALES_FROM }}                   # 任意（既定 sales@its-tokyo.com）
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}             # Notion連携トークン
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}         # ★親ページID（配下に日次候補ページを自動作成）
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}             # 任意（レビューDBへ行追加）
        run: python automation/ses-matching/run_ses_matching.py --source imap
      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ses-digest
          path: automation/ses-matching/digests/
          if-no-files-found: ignore
