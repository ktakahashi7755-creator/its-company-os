name: 営業進捗をNotionへ反映

on:
  push:
    branches: ["**"]
    paths:
      - "data/pipeline.md"
      - "data/bp-list.md"
      - "data/partners.md"
      - "automation/sync_pipeline_to_notion.py"
  workflow_dispatch: {}   # 手動実行

jobs:
  sync-notion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync sales sheets to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # append(既定/安全): 既存を消さず末尾に追記。朝会と同じページでも安全。
          # mirror: 専用ページの全消去→書き直し。専用ページにのみ使う。
          NOTION_SYNC_MODE: ${{ vars.NOTION_SYNC_MODE }}
          # 反映先ページ。専用にするなら NOTION_PIPELINE_PAGE_ID、朝会と共用なら NOTION_PAGE_ID。
          NOTION_PIPELINE_PAGE_ID: ${{ secrets.NOTION_PIPELINE_PAGE_ID }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: python automation/sync_pipeline_to_notion.py
